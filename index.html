        <img class="intro-photo" src="Asset Asli/About Me/Group 17.png" alt="Ariq Rifky Ghiffari">
        <p class="about-greeting">Halo, saya Ariq Rifky Ghiffari. <br><em>(Kamu juga bisa menyapaku MBAHHH!)</em> </p><p> Saya seorang kreator visual, dekorator panggung, dan content creator yang memiliki landasan karakter kuat dalam kedisiplinan dan adaptabilitas. Perjalanan saya dibentuk oleh dunia perantauan yang dinamis, mulai dari lingkungan kompetitif di Pondok Modern Darussalam Gontor hingga eksplorasi dunia digital. Dari seseorang yang awalnya introvert, saya bertransformasi menjadi pribadi yang adaptif, komunikatif, dan tertantang untuk mengubah ide abstrak menjadi karya visual yang nyata dan berdampak.</p>
      </div>
      <section class="about-section">
        <h2>Pilar Utama: Seni Visual, Dekorasi Skala Besar, &amp; Komunikasi</h2>
        <p>Kekuatan utama saya terletak pada kemampuan mengeksplorasi estetika ruang dan komunikasi visual. Saya terbiasa melihat ruang kosong atau media mentah sebagai kanvas besar yang siap dihidupkan.</p>
        <h3>Seni Dekorasi &amp; Manajemen Panggung</h3>
        <p>Saya memiliki pengalaman bertahun-tahun merancang dan mengeksekusi dekorasi berskala besar, termasuk untuk acara seperti Panggung Gembira dan Drama Arena. Pengalaman ini mencakup melukis manual di media triplek raksasa, mengonsep baliho, serta berkolaborasi dengan divisi elektro dan struktur panggung untuk menciptakan keselarasan estetika dan pencahayaan.</p>
        <h3>Kepemimpinan Kreatif &amp; Manajemen Organisasi</h3>
        <p>Kepercayaan memimpin divisi pengurus seni (ANDUKASI) dan mengelola aspek finansial serta operasional sebagai Bendahara ANKUKEDAP di OPPM mengajarkan saya bekerja terstruktur, memenuhi tenggat, dan berkolaborasi dalam tim multidisiplin.</p>
      </section>
      <section class="about-section">
        <h2>Jiwa Kreatif: Content Creator &amp; Storytelling</h2>
        <p>Bagi saya, seni tidak berhenti di panggung fisik, tetapi juga hadir di ruang digital melalui content creation. Saya menggunakan kepekaan visual, pemahaman hierarki estetika, dan kemampuan <strong>storytelling</strong> untuk menciptakan konten yang menarik, kreatif, dan relevan bagi audiens.</p>
        <p>Proses pembuatan konten—mulai dari penggalian ide, penyusunan konsep, eksekusi visual, hingga interaksi dengan audiens—menjadi cara saya menyalurkan jiwa seni ke dalam bentuk yang dinamis dan modern.</p>
      </section>
      <section class="about-section">
        <h2>Kecakapan Digital &amp; Teknis</h2>
        <p>Untuk mendukung proses kreatif, saya terus membekali diri dengan pemahaman teknologi digital dan desain. Saya adaptif menggunakan tools digital untuk visualisasi ide, perancangan tata letak, serta penyampaian pesan dan performa konten. Kecakapan ini membantu saya mengeksekusi karya secara efisien dan mengikuti perkembangan tren.</p>
      </section>
      <section class="about-section">
        <h2>Mengapa Bekerja dengan Saya?</h2>
        <p>Saya membawa etos kerja perantau yang tangguh, kedisiplinan, ketajaman estetika, dan cara berpikir kreatif. Saya memperhatikan hasil visual sekaligus kolaborasi, manajemen waktu, dan bagaimana sebuah karya menyampaikan pesan yang kuat kepada audiens.</p>
      </section>

      <h2>TK Al Amin Jember</h2>
      <div class="tk-story">
        <h3 class="tk-story-title">Jejak Awal: Menanam Imajinasi dan Keceriaan di Masa Taman Kanak-Kanak (TK)</h3>
        <figure class="tk-photo tk-photo-small">

        <p>Sebelum melangkah ke dunia perantauan dan organisasi yang kompetitif, fondasi karakter saya dimulai dari dunia yang penuh warna di masa Taman Kanak-Kanak (TK).</p>
        <p>Seperti masa kecil anak-anak pada umumnya, fase ini adalah ruang murni untuk bermain, bereksperimen, dan mengenal dunia luar.</p>
        <p>Meskipun sederhana, masa TK memberikan kontribusi awal bagi pembentukan diri saya melalui dua hal penting:</p>
        <h4>Eksplorasi Kreativitas Tanpa Batas</h4>
        <p>Lewat aktivitas sederhana seperti menggambar bebas, mewarnai, dan menyusun balok mainan, di sinilah motorik halus dan daya imajinasi saya pertama kali terasah. Kegemaran saya pada dunia seni visual dan dekorasi yang saya tekuni hari ini berakar dari coretan-coretan kertas di meja kelas TK.</p>
        <h4>Belajar Bersosialisasi &amp; Berbagi</h4>
        <p>Sebagai anak yang awalnya memiliki kecenderungan introvert, momen bermain bersama di taman bermain, mengantre giliran perosotan, dan berbagi mainan dengan teman sebaya adalah simulasi pertama saya dalam memahami konsep komunikasi, empati, dan kerja sama tim dalam bentuk yang paling sederhana.</p>
        <p>Masa TK mungkin penuh dengan tawa dan permainan, namun dari sanalah rasa ingin tahu (curiosity) dan keberanian saya untuk mulai bersentuhan dengan dunia luar pertama kali tumbuh.</p>

      <h2>SD Al Baitul Amien Jember</h2>
      <div class="tk-story">
        <h3 class="tk-story-title">Fondasi Kompetitif dan Eksplorasi Sains di SD Al Baitul Amin Jember</h3>
        <p>Setelah melewati masa-masa ceria di Taman Kanak-Kanak, langkah akademis saya berlanjut di SD Al Baitul Amin Jember (2011 – 2017). Fase enam tahun di sekolah dasar ini menjadi milestone krusial di mana minat saya terhadap ilmu pengetahuan, fokus, dan mentalitas kompetitif mulai terbentuk dan teruji di berbagai ajang formal.</p>
        <figure class="education-story-photo">
          <img src="Asset Asli/Educational History/Foto sd.png" alt="Kenangan Ariq di SD Al Baitul Amien Jember">
          <figcaption>Kenangan di SD Al Baitul Amien Jember.</figcaption>
        </figure>
        <p>Di sekolah ini, saya berhasil mengasah potensi akademis melalui beberapa pencapaian dan rekam jejak penting:</p>
        <ul>
          <li><h4>Konsistensi Akademik di Lini Depan:</h4>
          Pada fase awal sekolah dasar (Kelas 1 hingga Kelas 3), saya berhasil mempertahankan performa belajar di tingkat optimal dan secara konsisten meraih Peringkat 1 di kelas. Fase ini melatih kedisiplinan belajar dan rasa ingin tahu saya terhadap hal-hal baru.</li>
          <li><h4>Ajang Olimpiade Sains Nasional (OSN) Tingkat Provinsi (Kelas 2):</h4>
          Ketertarikan saya pada ilmu terapan membawa saya terpilih untuk berkompetisi di ajang Olimpiade Sains Nasional (OSN). Melalui seleksi yang ketat, saya berhasil menembus batasan lokal dan berjuang mewakili sekolah hingga ke Tingkat Provinsi. Meskipun langkah menuju tingkat nasional terhenti di fase ini, pengalaman ini memberikan pelajaran berharga mengenai ketahanan mental, persiapan strategis, dan skala kompetisi yang luas.</li>
          <li><h4>Penghargaan Kompetisi Bahasa Inggris Tingkat Kabupaten (Kelas 3):</h4>
          Selain di bidang sains, saya juga mengeksplorasi kemampuan komunikasi linguistik. Saya berhasil meraih penghargaan Juara Harapan 10 dalam Lomba Bahasa Inggris Tingkat Kabupaten. Pencapaian ini menjadi fondasi awal saya dalam memahami bahasa asing, yang di kemudian hari sangat membantu saya saat mengemban amanah sebagai Bagian Bahasa di organisasi pondok modern.</li>
          <li><h4>Eksplorasi Berkelanjutan di Bidang IPA & Sains:</h4>
          Sepanjang masa sekolah dasar, saya aktif mendaftarkan diri dan berpartisipasi dalam berbagai kompetisi perlombaan IPA dan Sains. Bagi saya, setiap perlombaan sains bukan sekadar ajang berburu trofi, melainkan ruang eksperimen untuk melatih logika berpikir terstruktur dan kemampuan memecahkan masalah (problem-solving).</li>
        </ul>
        <p>Masa-masa di SD Al Baitul Amin Jember telah membuktikan bahwa jauh sebelum saya bergelut di industri multimedia dan kepemimpinan organisasi, saya telah ditempa untuk menjadi seorang pembelajar yang gigih, berorientasi pada detail, dan tidak takut menghadapi tantangan kompetisi yang besar. </p>

      <div class="tk-story">
        <h3 class="tk-story-title">Mengukir Jati Diri di Gontor: Perjalanan Transformasi dari Seorang Introvert Menjadi Pemimpin Kreatif</h3>
        <h4>Pendahuluan: Langkah Awal Menuju Dunia Perantauan</h4>
        <p>Perjalanan hidup dan pembentukan karakter saya dimulai dari sebuah langkah berani: merantau dan menuntut ilmu di Pondok Modern Darussalam Gontor, Mlarak, Ponorogo. Tempat ini bukan sekadar lembaga pendidikan bagi saya, melainkan gerbang awal yang menumbuhkan kecintaan saya pada dunia perantauan, kemandirian, dan adaptasi di lingkungan yang dinamis.
Lahir sebagai seorang yang cenderung introvert, menghabiskan waktu selama 5 tahun di Gontor memaksa saya untuk keluar dari zona nyaman. Di tengah ekosistem yang penuh disiplin dan tantangan ini, saya mulai membuka diri, menggali potensi tersembunyi, dan menemukan jati diri yang sesungguhnya.</p>
        <h4>2. Rekam Jejak Akademik & Kemampuan Adaptasi</h4>
        <p>Sistem pendidikan di Gontor menerapkan penempatan kelas yang kompetitif berdasarkan tingkat evaluasi kecerdasan dan dinamika santri di setiap tahunnya. Berada di lingkungan yang kompetitif ini melatih saya untuk memiliki mental yang tangguh dan selalu siap beradaptasi dengan lingkungan baru. Berikut adalah riwayat penempatan kelas saya:</p>
        <ul>
          <li>Tahun Pertama: Kelas 1B</li>
          <li>Tahun Kedua: Kelas 2D</li>

        <h4>3. Pengalaman Bidang Kepanduan, Kepemimpinan, & Pengelolaan Organisasi</h4>
        <p>Pendidikan non-akademik di Gontor menjadi katalis utama perubahan karakter saya, terutama melalui gerakan kepramukaan:</p>
        <ul>
          <li><strong>Pasukan Khusus (Pasus) Pramuka Gugus Depan 15089 - 17 (Tahun Kedua):</strong> Ini adalah titik balik terbesar dalam hidup saya. Melalui Pasus, saya ditempa secara mental dan fisik. Di sinilah saya membangun fondasi karakter yang kuat: ketegasan, kedisiplinan tinggi, rasa tanggung jawab, kepemimpinan, solidaritas, serta rasa kekeluargaan yang erat.</li>
          <li><strong>Pengurus Andalan Gugus Depan Urusan Karya dan Seni / ANDUKASI (Tahun Ketiga):</strong> Saya dipercaya untuk naik tingkat menjadi pengurus yang bertanggung jawab atas pengelolaan Majalah Dinding (Mading) dan seluruh properti dekorasi untuk kegiatan kepramukaan berskala besar.</li>

         <figure class="education-story-photo">
          <img src="Asset Asli/Educational History/Foto PM 4 pg.png" alt="Acara Drama Arena di PM Darussalam Gontor 1">

        <h4>4. Pengalaman Bidang Seni, Kreativitas, & Dekorasi Proyek (Hard Skills)</h4>
        <p>Seiring berjalannya waktu, minat saya mengerucut kuat di bidang seni visual dan dekorasi ruang. Di Gontor, bagian dekorator dituntut memiliki ketahanan fisik dan kreativitas tinggi karena media yang digunakan berskala besar:</p>
        <ul>
          <li><strong>Dekorator Kepanitiaan Acara Besar (Tahun Keempat): </strong> Saya selalu dipercaya untuk memegang posisi dekorator. Tugas kami meliputi pembuatan mading, baliho, dan background panggung utama menggunakan media triplek. Di sini saya mengasah kemampuan melukis manual berskala besar (mural/panggung).</li>
          <li><strong>Kolaborasi Lintas Divisi: </strong> Dalam pengerjaannya, saya terbiasa berkolaborasi dengan Bagian Elektro (untuk instalasi pencahayaan seni) dan Bagian Persidangan (pembuatan struktur panggung berat) untuk menyelaraskan konsep pengecatan dan estetika visual panggung.</li>
          <li><strong>Dekorator Drama Arena (Tahun Kelima):</strong> Saya berkontribusi dalam tim dekorasi untuk Drama Arena, sebuah pentas seni tahunan yang sangat bergengsi dan menjadi tolak ukur kreativitas santri di Gontor.</li>
        </ul>
        <h4>5. Pengalaman Manajemen, Sosial, & Operasional (Soft Skills)</h4>
        <p>Pada tahun kelima, tanggung jawab saya diperluas ke ranah manajemen manusia dan operasional harian:</p>
        <ul>
          <li><strong>Pengurus Asrama (Bagian Kesehatan & Bahasa):</strong> Saya mengemban amanah untuk mengayomi, mendisiplinkan, dan mengurus kebutuhan santri junior (kelas 2 dan 3). Tugas ini mengasah kemampuan komunikasi interpersonal, konseling, dan manajemen konflik saya.</li>
          <li><strong>Pengurus Kantin (Manajemen Operasional & Supply Chain):</strong> Di akhir tahun, saya ditugaskan di bagian kantin. Tanggung jawab saya meliputi:
          <ul>
            <li>Merancang estetika dan dekorasi ruang kantin agar menarik.</li>
            <li>Menjaga dan mengelola operasional harian kantin.</li>
            <li>Membantu proses supply chain (mencari dan menyediakan bahan baku masakan) bersama para pekerja kantin.</li>
          </ul>
          </li>
        </ul>
        <h4>6. Kesimpulan: Transformasi Karakter & Kesiapan Menghadapi Dunia Nyata</h4>
        <p>Nilai yang Saya Bawa Hari Ini Lima tahun menempa diri di Pondok Modern Darussalam Gontor telah mengubah saya menjadi pribadi yang utuh. Dari seorang introvert, saya bertransformasi menjadi individu yang kreatif, memiliki kepemimpinan kuat, terbiasa bekerja di bawah tekanan, dan mampu berkolaborasi dalam tim multidisiplin. Semua pengalaman visual, organisasi, dan manajerial ini adalah aset berharga yang selalu saya bawa dalam setiap proyek profesional yang saya kerjakan saat ini.</p>

        <p>Menjadi santri Kelas 6 di Gontor berarti siap menghadapi kurikulum kelulusan yang sangat komprehensif dan menguji ketahanan mental. Di tahun ini, fokus akademik saya meliputi:</p>

        <h4>3. Kepemimpinan & Penegakan Disiplin: Bagian Bahasa (Organisasi Bulan Syawwal)</h4>
        <p>Pada masa awal tahun ajaran baru, tepatnya dalam struktur Organisasi Bulan Syawwal, saya ditunjuk sebagai Bagian Disiplin (Bahasa).</p>
        <ul>
          <li>Tugas utama saya adalah mengawasi, mengedukasi, dan menegakkan disiplin penggunaan bahasa resmi (Arab dan Inggris) bagi seluruh santri.</li>
          <li>Posisi ini melatih kemampuan komunikasi persuasif saya, ketegasan, serta manajemen konflik di lingkungan komunitas yang besar.</li>
        </ul>
        <h4>4. Pengalaman Finansial & Operasional: </h4>
        <p>OPPM - Koordinator Pramuka (ANKUKEDAP) Ketika amanat OPPM (Organisasi Pelajar Pondok Modern) resmi diserahkan, saya dipercaya untuk mengemban posisi di Koordinator Gerakan Pramuka, spesifiknya pada divisi ANKUKEDAP (Andalan Koordinator Urusan Kedai Pramuka) dengan amanah sebagai Bendahara. Tanggung jawab saya meliputi:</p>
        <ul>

    <article data-school="pens" class="content education-detail education-detail-centered">
      <p class="eyebrow">PENDIDIKAN TINGGI · 2024–SEKARANG</p>
      <h2>Politeknik Elektronika Negeri Surabaya</h2>
      <div class="tk-story">
        <h3 class="tk-story-title">Rekayasa Teknologi Multimedia: Transformasi Kreativitas Manual ke Ranah Digital Terintegrasi di Politeknik Elektronika Negeri Surabaya</h3>
        <h4>1. Pendekatan Akademis: Jembatan Menuju Dunia Rekayasa Digital</h4>
        <p>Setelah melewati berbagai tempaan karakter, kedisiplinan, dan kepemimpinan di pondok modern, saya melanjutkan langkah akademis ke jenjang pendidikan tinggi di Politeknik Elektronika Negeri Surabaya (PENS) dengan mengambil program studi Teknologi Rekayasa Multimedia. Berada di kampus yang terkenal dengan iklim akademisnya yang kompetitif dan disiplin tinggi ini, fokus utama saya adalah mentransformasikan seluruh pengalaman visual manual serta ketelitian kerja yang telah saya miliki sebelumnya ke dalam penguasaan teknologi digital modern. Edukasi di PENS tidak hanya menguji kemampuan estetika visual saya, melainkan menuntut penguasaan logika pemrograman, arsitektur jaringan multimedia, hingga penjaminan mutu perangkat lunak (software quality assurance).</p>
        <h4>2. Rekam Jejak Kompetensi: Eksplorasi Spektrum Multimedia Terintegrasi</h4>
        <p>Sistem pendidikan praktik di PENS menantang saya untuk mengeksplorasi spektrum multimedia yang sangat luas dan adaptif. Selama menempuh studi, saya berhasil menguasai dan menyelaraskan empat pilar kompetensi utama:</p>
        <ul>
          <li>Desain Antarmuka (UI/UX Design): Mengadopsi metode User-Centered Design menggunakan Figma untuk merancang arsitektur informasi yang kompleks menjadi antarmuka yang simpel, interaktif, dan mudah dikenali oleh pengguna.</li>
          <li>Rekayasa Web (Web Development): Membangun fondasi arsitektur frontend web menggunakan HTML, CSS, dan framework Bootstrap untuk menghasilkan platform digital dan e-commerce yang responsif.</li>
          <li>Pemrograman Aplikasi Mobile (Mobile Development): Mendalami logika teknologi video serta pengembangan aplikasi bergerak yang dinamis menggunakan framework Flutter dan bahasa Dart.</li>
          <li>Teknologi Imersif (Mixed Reality Development): Memasuki lini terdepan teknologi masa depan dengan memanfaatkan Unity dan perangkat canggih HoloLens 2 untuk rekayasa sistem multiplayer lintas platform.</li>
        </ul>
        <figure class="education-story-photo">
          <img src="Asset Asli/Educational History/Foto pens 1.png" alt="Kenangan Ariq di Politeknik Elektronika Negeri Surabaya">
          <figcaption>MC Acara Prodi</figcaption>
        </figure>
        <h4>3. Pengalaman Proyek dan Implementasi Berbasis Laboratorium</h4>
        <p>Model pembelajaran berbasis proyek (Project-Based Learning) di PENS melatih saya untuk terbiasa mengelola siklus hidup pengembangan produk digital melalui kolaborasi tim multidisiplin:</p>
        <ul>
          <li>Fase Inisiasi dan Desain (Product Ideation): Bertindak sebagai pencari ide produk yang bertugas menyusun alur pengalaman pengguna, merancang sketsa kasar, hingga mematangkan draf visual di Figma sebagai cetak biru utama bagi tim pengembang.</li>
          <li>Fase Pengembangan Teknis (Development): Terlibat langsung dalam penyusunan struktur kode frontend, integrasi manajemen basis data CRUD (Stok Makanan dan Pendaftaran Toko), hingga konfigurasi arsitektur jaringan sinkronisasi data real-time.</li>
          <li>Fase Penjaminan Mutu (Quality Assurance): Melakukan pengujian fungsionalitas sistem lintas perangkat keras (seperti sinkronisasi data antara HoloLens 2 dan Android) untuk memastikan produk bebas dari kendala teknis sebelum siap diimplementasikan.</li>
        </ul>
        <h4>4. Analisis Teknis</h4>
        <p>Penyelesaian Masalah secara Metodologis Melalui ekosistem laboratorium di PENS, saya berhasil menyelaraskan teori ilmiah dengan kebutuhan industri modern. Saya terlatih untuk menyelesaikan masalah rekayasa secara terstruktur, seperti mengintegrasikan algoritma kalibrasi pemrosesan citra digital dengan pipeline otomatisasi multimedia server, hingga memecahkan kendala pembacaan sensor dan sinkronisasi data real-time pada sistem jaringan multiplayer lintas perangkat keras. Proses ini secara matang membentuk pola pikir saya menjadi seorang teknisi yang solutif, jeli terhadap detail, dan adaptif terhadap pembaruan teknologi.</p>
        <h4>5. Kesimpulan: Nilai yang Saya Bawa ke Industri</h4>
        <p>Pendidikan di Politeknik Elektronika Negeri Surabaya berhasil memvalidasi kapasitas saya sebagai seorang Multimedia Engineer yang komprehensif. PENS telah mengubah paradigma berpikir saya, membuktikan bahwa kreativitas visual yang kuat akan memberikan dampak yang jauh lebih besar ketika didukung oleh fondasi logika pemrograman yang matang, ketepatan penjaminan mutu, serta penguasaan teknologi masa depan yang inklusif dan berdaya guna tinggi di masyarakat.</p>
        <figure class="education-story-photo">
          <img src="Asset Asli/Educational History/Foto pens 2.png" alt="Kenangan Ariq di Politeknik Elektronika Negeri Surabaya">
          <figcaption>Foto Personalia Prodi Teknologi Rekayasa Multimedia Angkatan 2024</figcaption>
        </figure>
      </div>

        <p class="experience-detail-organization">Macaronicuck</p>
        <p>Saya memperluas pengalaman di industri kreatif digital melalui peran sebagai Content Creator di Macaronicuck. Berbeda dari pembuatan konten rutin di outlet, peran ini berfokus pada produksi konten berbasis proyek dan acara. Saya bertugas menangkap momen aktivasi brand di berbagai event sekaligus mendukung kebutuhan operasional tim di lapangan.</p>

          <img src="../Assets/Figma/Prototype2/experience-05.png" alt="Pengalaman sebagai brand ambassador di Macaronicuck">
          <figcaption>Dokumentasi pengalaman di Macaronicuck.</figcaption>
        </figure>
        <h4>1. Produksi Konten Berbasis Event</h4>
        <p>Produksi konten di tengah acara menuntut kepekaan dan kreativitas dalam ritme lapangan yang cepat. Saya membuat konten secara mobile di berbagai acara komersial, bazar, dan festival tempat Macaronicuck membuka stan.</p>

          <li>Merekam suasana acara, antusiasme pengunjung, antrean pembeli, dan interaksi di sekitar stan.</li>
          <li>Memanfaatkan momentum dan tren audio atau media sosial yang relevan untuk menghasilkan konten segar yang mengundang audiens datang langsung ke stan.</li>
        </ul>
        <h4>2. Dukungan Operasional Stan</h4>
        <p>Peran saya juga mencakup bantuan langsung kepada tim operasional, khususnya saat stan ramai pengunjung.</p>
        <ul>
          <li>Mendukung pelayanan, interaksi dengan pelanggan, dan persiapan produk sesuai kebutuhan tim di lapangan.</li>
          <li>Menggunakan pengalaman berinteraksi langsung dengan konsumen untuk memahami preferensi mereka dan membuat konten yang lebih autentik serta relevan.</li>
        </ul>
        <h4>3. Adaptabilitas dan Komunikasi</h4>
        <ul>
          <li>Beradaptasi dengan lokasi acara, pencahayaan, dan tingkat keramaian yang berbeda sambil tetap berupaya menghasilkan video berkualitas.</li>
          <li>Berinteraksi dengan pengunjung dari beragam latar belakang serta mengamati respons audiens secara langsung sebagai bagian dari pengalaman pemasaran offline.</li>
        </ul>
        <h4>4. Nilai yang Saya Bawa</h4>
        <p>Pengalaman di Macaronicuck melengkapi kemampuan produksi video end-to-end yang saya kembangkan di Miejol dengan kreativitas, kemandirian, dan kelincahan bekerja di lapangan. Saya mampu menyelaraskan pembuatan konten digital dengan aktivitas brand di acara offline, serta membawa energi dan fleksibilitas untuk mendukung visibilitas brand dan pengalaman pelanggan.</p>

    <article data-experience="dpm-pens" class="content education-detail education-detail-centered experience-detail">
      <div class="tk-story">
        <p class="eyebrow">PENGALAMAN ORGANISASI</p>
        <h3 class="tk-story-title" data-experience-title>Badan Komunikasi dan Informasi</h3>
        <p class="experience-detail-organization">Dewan Perwakilan Mahasiswa PENS · Sedang menjabat</p>
        <p>Di luar pengembangan produk digital dan rekayasa perangkat lunak, saya memperluas kapasitas profesional ke ranah komunikasi publik strategis sebagai anggota Badan Komunikasi dan Informasi (Kominfo) di Dewan Perwakilan Mahasiswa (DPM) Politeknik Elektronika Negeri Surabaya (PENS).</p>
        <p>Peran ini menuntut kemampuan analisis audiens, ketepatan waktu dalam pengelolaan informasi, serta pemahaman tentang cara menyampaikan informasi pemerintahan mahasiswa secara transparan, edukatif, dan profesional kepada civitas academica.</p>
        <h4>1. Ruang Lingkup dan Eksekusi Manajerial</h4>
        <p>Sebagai operator dan pengelola lini masa media sosial resmi <strong>@dpmpens</strong>, saya terlibat dalam siklus publikasi digital institusi melalui beberapa tanggung jawab berikut:</p>
        <ul>
          <li><strong>Transparansi institusional:</strong> Merancang publikasi dokumen legal dan administratif, seperti Surat Keputusan (SK) dan regulasi mahasiswa, dalam format visual yang mudah diakses dan dipahami tanpa mengurangi keabsahan informasinya.</li>
          <li><strong>Strategi konten edukatif:</strong> Menyusun konten Edukasi Pemerintahan melalui riset kebijakan, perumusan copywriting yang lugas, dan desain interaktif untuk meningkatkan pemahaman mahasiswa mengenai kebijakan dan birokrasi kampus.</li>
          <li><strong>Pelaporan langsung:</strong> Meliput dan menyampaikan informasi secara real-time dari acara, sidang, dan forum DPM PENS dengan mengutamakan kecepatan, ketepatan fakta, dan kesiapan bekerja di bawah tekanan waktu.</li>
          <li><strong>Engagement dan relasi publik:</strong> Merancang kalender konten hari besar nasional dan internasional agar DPM PENS hadir secara relevan dan konsisten di ruang digital.</li>
        </ul>
        <h4>2. Manajemen Platform dan Pengendalian Mutu Visual</h4>
        <p>Dalam mengelola akun Instagram resmi organisasi tingkat politeknik, saya menerapkan pengendalian mutu visual melalui konsistensi tata letak, hierarki tipografi, dan pemilihan palet warna yang selaras dengan identitas DPM PENS. Setiap takarir dan aset visual juga diverifikasi untuk menjaga ketepatan informasi serta menghindari misinformasi dan bias komunikasi.</p>
        <h4>3. Nilai yang Saya Kembangkan</h4>
        <p>Pengalaman ini melengkapi portofolio teknis saya dengan keterampilan manajemen media sosial, hubungan masyarakat, dan komunikasi strategis. Saya belajar mengomunikasikan nilai, kebijakan, dan informasi publik secara efektif kepada audiens luas, sekaligus mengelola alur kerja informasi yang cepat, dinamis, dan berdampak.</p>
      </div>

    <article data-article="smart-tumbler">
<h4>1. Ringkasan Proyek</h4>
  <p>Proyek ini dikerjakan untuk memenuhi penilaian mata kuliah Manajemen Proyek. Gagasannya adalah merancang Smart Tumbler: wadah minum portabel yang mengadaptasi fungsi dispenser ke bentuk ringkas. Dalam konsep ini, baterai terintegrasi dirancang untuk mendukung penggunaan mobile.</p>
  <h4>2. Latar Belakang dan Solusi</h4>
  <p>Dispenser konvensional sulit dibawa dan bergantung pada sumber listrik, sementara tumbler biasa hanya menjaga suhu dan tidak dapat mengubah suhu air secara aktif atau mengaduk minuman bubuk. Proyek ini mengeksplorasi konsep wadah minum pintar yang dirancang untuk memberi pengguna pilihan pemanasan, pendinginan, dan pengadukan minuman dalam satu perangkat portabel.</p>
  <h4>3. Fitur Utama dalam Konsep</h4>
  <ul>
    <li><strong>Pemanasan dan pendinginan aktif:</strong> Konsep pengaturan suhu untuk mode hangat maupun dingin dalam ukuran ringkas dengan sumber daya baterai.</li>
    <li><strong>Pengaduk otomatis:</strong> Mekanisme pengaduk terintegrasi yang dirancang untuk membantu melarutkan kopi, susu, atau suplemen tanpa alat pengaduk eksternal.</li>
    <li><strong>Antarmuka pintar:</strong> Panel digital pada tutup untuk menampilkan informasi suhu, mode, dan waktu penggunaan.</li>
  </ul>
  <h4>4. Pendekatan Manajemen Proyek</h4>
  <ul>
    <li><strong>Manajemen ruang lingkup:</strong> Menentukan batasan fitur yang sesuai dengan ukuran portabel, termasuk mempertimbangkan kebutuhan daya untuk sistem termal dan motor pengaduk.</li>
    <li><strong>Desain dan prototyping visual:</strong> Membuat rancangan dan visualisasi 3D untuk mengomunikasikan konsep kepada dosen dan pemangku kepentingan sebelum kemungkinan pengembangan fisik.</li>
    <li><strong>Manajemen risiko:</strong> Mengidentifikasi tantangan konseptual seperti isolasi panas dan dingin agar tidak berdampak pada komponen baterai, serta pemilihan material bagian dalam yang aman untuk kontak dengan minuman.</li>
  </ul>
  <h4>5. Kesimpulan dan Nilai Akademis</h4>
  <p>Proyek Smart Tumbler menggabungkan eksplorasi teknik konversi energi, desain produk, dan manajemen linimasa. Melalui proyek ini, saya berlatih merencanakan inovasi teknologi dari perumusan masalah dan penentuan ruang lingkup hingga visualisasi konsep yang siap ditinjau lebih lanjut.</p>
    </article>

<h4>1. Ringkasan Proyek</h4>
  <p>Proyek kelompok ini dikembangkan untuk memenuhi penilaian mata kuliah Storytelling Interaktif. Cerita rakyat Jawa Timur, “Asal-Usul Telaga Sarangan”, diadaptasi ke dalam media modern berupa visual novel interaktif. Saya bertanggung jawab sebagai Asset Creator—desainer grafis dan ilustrator—untuk memproduksi elemen visual game menggunakan Adobe Illustrator.</p>

  <p>Tantangan utamanya adalah menerjemahkan cerita tradisional menjadi aset digital yang menarik bagi generasi muda, dengan tetap menjaga nilai budaya, lokalitas, serta atmosfer mistis dan historis cerita Telaga Sarangan. Saya menggunakan desain vektor di Adobe Illustrator agar karakter dan latar memiliki bentuk yang tegas, warna yang konsisten, dan dapat diskalakan untuk integrasi ke dalam game.</p>
  <h4>3. Ruang Lingkup Aset Visual</h4>
  <ul>
    <li><strong>Desain karakter dan ekspresi:</strong> Merancang tokoh seperti Kyai Pasir dan Nyai Pasir, termasuk variasi ekspresi dan pose untuk mendukung penyampaian dialog.</li>
    <li><strong>Ilustrasi latar:</strong> Membuat lingkungan cerita, mulai dari area ladang atau hutan kuno dan penemuan telur misterius hingga adegan terbentuknya cekungan Telaga Sarangan.</li>
    <li><strong>Antarmuka dan properti:</strong> Mendesain kotak dialog, tombol pilihan interaktif, dan properti cerita seperti telur gaib.</li>
  </ul>
  <h4>4. Alur Kerja Desain</h4>
  <ol>
    <li><strong>Studi referensi dan moodboard:</strong> Mengumpulkan referensi pakaian Jawa kuno, anatomi, serta lanskap sekitar Gunung Lawu untuk mendukung konteks visual cerita.</li>
    <li><strong>Sketsa dan tracing:</strong> Membuat sketsa anatomi karakter serta komposisi latar, lalu merapikannya menjadi bentuk vektor menggunakan Pen Tool di Adobe Illustrator.</li>
    <li><strong>Pewarnaan dan pencahayaan:</strong> Memilih warna untuk membangun suasana adegan—warna hangat untuk momen damai dan warna lebih gelap atau kontras untuk bagian klimaks.</li>
    <li><strong>Ekspor dan optimalisasi:</strong> Mengekspor aset sebagai PNG berlatar transparan dengan resolusi yang sesuai kebutuhan tim pengembang game.</li>
  </ol>
  <h4>5. Kesimpulan dan Nilai Pembelajaran</h4>
  <p>Proyek ini menyatukan storytelling tradisional dengan desain digital modern. Sebagai Asset Creator, saya mengembangkan kemampuan menerjemahkan naskah menjadi visual, menjaga konsistensi art style, dan berkolaborasi dalam tim produksi media interaktif.</p>
    </article>

<h4>1. Ringkasan Proyek</h4>
  <p>Proyek kelompok ini dikembangkan sebagai luaran klinis mata kuliah Animasi 2D. Fokusnya adalah merancang dan memproduksi video animasi edukasi infografis tentang gizi makanan agar informasi pola makan seimbang serta nutrisi makro dan mikro dapat dipahami dengan cara yang menyenangkan. Saya berperan sebagai Storyboard Artist pada pra-produksi dan Lead Animator pada produksi menggunakan Adobe After Effects.</p>
  <h4>2. Pra-Produksi: Storyboard dan Alur Komunikasi</h4>
  <p>Untuk menyajikan informasi seperti kalori, vitamin, dan zat besi dengan menarik, saya menerjemahkan naskah dan materi gizi dari tim riset ke dalam panel storyboard yang terstruktur.</p>

    <li>Memetakan materi menjadi urutan visual agar pesan edukasi mudah diikuti.</li>
    <li>Merencanakan komposisi, tata letak elemen, pergerakan kamera, dan transisi antarkomponen gizi untuk menjaga alur informasi tetap logis dan dinamis.</li>
    <li>Menyiapkan storyboard sebagai panduan produksi dan acuan koordinasi tim.</li>
  </ul>
  <h4>3. Produksi: Animasi dengan Adobe After Effects</h4>
  <p>Setelah storyboard disetujui, saya menghidupkan aset ilustrasi 2D menjadi motion graphics untuk mendukung penyampaian materi.</p>

    <li><strong>Prinsip animasi:</strong> Menerapkan timing, spacing, easing, dan anticipation dengan Easy Ease serta Graph Editor agar gerakan grafik terasa lebih halus dan organik.</li>
    <li><strong>Karakter dan tipografi kinetik:</strong> Menganimasikan maskot pemandu dan teks bergerak untuk mempertegas poin gizi yang disampaikan melalui voice-over.</li>
    <li><strong>Sinkronisasi audio-visual:</strong> Menyelaraskan gerak visual dengan musik latar dan efek suara, seperti saat ikon makanan muncul, untuk memperkuat pesan edukasi.</li>

  <h4>4. Komunikasi dan Manajemen Workflow</h4>
  <ul>
    <li>Menjembatani gagasan penulis naskah ke dalam rancangan visual dan gerakan animasi yang dapat diproduksi.</li>
    <li>Menyusun layer dan pre-compose secara teratur di After Effects agar revisi dan penyesuaian aset dapat dilakukan tanpa mengganggu keseluruhan timeline.</li>
  </ul>
  <h4>5. Kesimpulan dan Nilai Pembelajaran</h4>
  <p>Proyek ini mengembangkan kemampuan saya di sepanjang proses produksi multimedia—dari merancang komunikasi visual melalui storyboard hingga menganimasikan aset dan menyusun video edukasi di Adobe After Effects. Saya belajar menjaga kejelasan pesan, estetika, dan koordinasi tim dalam satu karya animasi.</p>

    <article data-article="waktu-jaga">
<h4>1. Ringkasan Proyek</h4>
  <p>“Waktu Jaga” adalah film pendek animasi 3D bergenre horor-psikologis yang dikembangkan sebagai proyek kelompok untuk mata kuliah Animasi 3D. Ceritanya membangun ketegangan dan misteri pada jam-jam krusial di malam hari. Dalam pipeline produksi, saya bertanggung jawab sebagai 3D Asset Creator sekaligus Scene Builder dan Set Dresser menggunakan Blender.</p>
  <h4>2. Pembuatan Aset 3D dan Material</h4>
  <p>Saya membuat berbagai properti interior dengan polygonal modeling di Blender, mulai dari furnitur, lampu lantai, dan jam dinding hingga elemen dekorasi pendukung cerita. Aset dirancang untuk memperkuat suasana dan kebutuhan adegan.</p>

    <li><strong>Pengaturan pencahayaan:</strong> Menggunakan pendekatan low-key lighting dengan Spot Light dan Point Light pada scene yang ditangani, untuk membentuk kontras dan bayangan serta mengarahkan perhatian pada bagian penting cerita.</li>

    <li>Menjaga topology aset tetap efisien pada tingkat low hingga mid-poly agar pengerjaan scene dan proses render lebih terkelola tanpa mengabaikan kebutuhan visual.</li>
    <li>Berkoordinasi dengan tim animator karakter dan sinematografer agar tata ruang dan aset mendukung pergerakan karakter serta kebutuhan sudut kamera.</li>

  <h4>5. Kesimpulan dan Nilai Pembelajaran</h4>

    <article data-article="jaringan-multimedia">
<h4>1. Ringkasan Proyek</h4>
  <p>Proyek ini dikembangkan untuk mata kuliah Jaringan Multimedia: aplikasi photobooth web untuk analisis undertone kulit dengan arsitektur Single Page Application (SPA) yang memproses alur secara asinkron. Aplikasi menggabungkan pengambilan gambar langsung, analisis sampel warna kulit, dan komposisi hasil komparatif menggunakan FFmpeg.</p>
  <h4>2. Antarmuka dan Alur Kerja Frontend</h4>
  <p>Antarmuka responsif dirancang menggunakan Bootstrap dan dikelola melalui HTML, CSS, serta JavaScript.</p>
  <ul>
    <li><strong>Akses kamera:</strong> Menggunakan HTML5 Media Capture API melalui <code>navigator.mediaDevices.getUserMedia</code> untuk menampilkan pratinjau kamera secara langsung dengan target resolusi 1280 × 720.</li>
    <li><strong>Panduan posisi wajah:</strong> Lapisan <code>.face-guide</code> di atas video membantu pengguna memosisikan wajah di tengah area tangkapan.</li>
    <li><strong>Pengambilan dan pengiriman gambar:</strong> Bingkai video disalin ke <code>&lt;canvas&gt;</code>, orientasi mirroring dibalik untuk mengembalikan posisi gambar, lalu diekspor sebagai Base64 Data URL dan dikirim melalui Fetch POST berformat JSON tanpa memuat ulang halaman.</li>
  </ul>
  <h4>3. Pemrosesan Citra dan Analisis Undertone</h4>
  <p>Backend PHP memproses payload gambar Base64, mendekode data biner, dan menyimpan gambar sementara di <code>Assets/uploads/</code>. Dengan PHP GD, aplikasi memindai sampel 40 × 40 piksel di area tengah gambar dan memisahkan nilai RGB melalui operasi bit-shifting.</p>
  <p>Untuk mengurangi bias warna yang dapat dipengaruhi Auto White Balance kamera, konsep klasifikasi membandingkan rata-rata kanal merah dan hijau dengan bobot kanal biru yang dikalibrasi sebesar <code>B<sub>avg</sub> × 1.20</code>. Jika <code>(R<sub>avg</sub> + G<sub>avg</sub>) / 2</code> lebih besar dari bobot tersebut, hasil diklasifikasikan sebagai warm; jika tidak, sebagai cool.</p>
  <h4>4. Pipeline Komposisi Multimedia</h4>
  <p>Setelah analisis selesai, server menggunakan FFmpeg untuk menyusun gambar hasil. Filter <code>hstack</code> menempatkan dua salinan foto secara berdampingan, lalu overlay warm dan cool diterapkan pada masing-masing sisi untuk menghasilkan tampilan komparatif.</p>
  <ul>
    <li>Hasil akhir diekspor sebagai JPG ke direktori <code>Assets/results/</code> dengan nama berbasis timestamp.</li>
    <li>Referensi file hasil dikirim kembali ke frontend dalam payload JSON untuk ditampilkan kepada pengguna.</li>
  </ul>
  <h4>5. Kesimpulan dan Nilai Pembelajaran</h4>
  <p>Proyek ini memberi saya pengalaman menghubungkan pengambilan media di browser, transmisi data asinkron, pemrosesan citra di sisi server, dan otomasi komposisi menggunakan FFmpeg. Saya belajar bagaimana komponen jaringan dan multimedia dapat dirangkai menjadi aplikasi interaktif yang memberikan hasil visual langsung kepada pengguna.</p>
    </article>

  <ul>
    <li><strong>Pemilihan lantai:</strong> Memilih salah satu dari tiga zona eksplorasi yang mengikuti lantai 1, 2, dan 3 Galaxy Mall 3.</li>
    <li><strong>Eksplorasi dan berburu harta:</strong> Menjelajahi koridor mall untuk menemukan peti virtual yang ditempatkan sebagai titik interaksi di depan gerai tertentu.</li>

  <h4>4. Sistem Jaringan Multiplayer</h4>
